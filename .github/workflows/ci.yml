# Checks every pull request. A push to main runs the same checks, then ships that export to
# botcgrimoire.com with the Worker in wrangler.jsonc, using the CLOUDFLARE_ACCOUNT_ID and
# CLOUDFLARE_API_TOKEN secrets.
name: CI

on:
  # Every pull request runs: a check skipped by a path filter never reports, and a required one
  # would then block the merge.
  pull_request:
  # A push that changes only Markdown or the license changes nothing the app bundles, and its pull
  # request already ran the checks, so its run would spend Actions minutes to deploy the same
  # files. Run by hand to ship anyway.
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - LICENSE
  workflow_dispatch:

# No step needs the token for more than reading the repository.
permissions:
  contents: read

# A newer push replaces the run still going on the same branch, deploys included.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # A green run takes about five minutes. Without a limit, a stalled step would hold a runner
    # for GitHub's default of six hours, and its pull request would wait as long for a result.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # The cache only saves time: a warm export takes seconds instead of over a minute and writes
      # the same files. Metro keys a cached module by its own source, not by app.json or the Metro
      # config, which it bakes into the bundle, so the key names both and a change to either starts
      # from no cache.
      - uses: actions/cache@v6
        with:
          path: /tmp/metro-cache
          key: metro-${{ hashFiles('package-lock.json', 'app.json', 'metro.config.js') }}
      - run: npm ci
      # The runner image already has the headless shell's libraries. --with-deps only added fonts
      # the app does not use, through an apt mirror that sometimes stalled for nine minutes.
      - run: npx playwright install --only-shell chromium
      - name: Verify the application and exported site
        run: npm run verify
      # Only this repository holds the Cloudflare secrets, so a fork's main skips the deploy instead
      # of failing it. They are in this step's environment alone, but every earlier step shares its
      # runner and could rewrite node_modules/wrangler, which this step then runs with them. So a
      # change to the dependencies or the lockfile is reviewed as one that could deploy.
      - name: Deploy
        if: github.repository == 'btroussel/botcgrimoire' && github.ref == 'refs/heads/main'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failures
          path: test-results/
